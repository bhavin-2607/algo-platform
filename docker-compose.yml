version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: algo_frontend
    restart: unless-stopped
    networks:
      - algo_net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: algo_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      - algo_net
    volumes:
      - ./strategy:/app/strategy

  strategy_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: algo_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      - algo_net
    volumes:
      - ./strategy:/app/strategy

  celery_beat:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: algo_beat
    restart: unless-stopped
    env_file: .env
    command: celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      - redis
      - postgres
    networks:
      - algo_net

  postgres:
    image: postgres:16-alpine
    container_name: algo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - algo_net

  redis:
    image: redis:7-alpine
    container_name: algo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - algo_net

  nginx:
    image: nginx:alpine
    container_name: algo_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - algo_net

volumes:
  postgres_data:
  redis_data:

networks:
  algo_net:
    driver: bridge
