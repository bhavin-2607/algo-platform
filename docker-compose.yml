version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: algo_frontend
    restart: unless-stopped
    networks:
      - algo_net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: algo_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      - algo_net
    volumes:
      - ./strategy:/app/strategy

  strategy_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: algo_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      - algo_net
    volumes:
      - ./strategy:/app/strategy

  postgres:
    image: postgres:16-alpine
    container_name: algo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - algo_net

  redis:
    image: redis:7-alpine
    container_name: algo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - algo_net

  nginx:
    image: nginx:alpine
    container_name: algo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - algo_net

  prometheus:
    image: prom/prometheus:latest
    container_name: algo_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - algo_net

  grafana:
    image: grafana/grafana:latest
    container_name: algo_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - algo_net

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  algo_net:
    driver: bridge
